# Programmi veri dello studio: indirizzi e nome del campo da compilare.
# Questo file lo puoi correggere tu, senza toccare il programma.
# Il campo si trova per nome, non per posizione del mouse: se il sito sposta
# le cose, l'Agent non sbaglia riga.
#
# field: pezzo di pagina dove scrivere (attributo name, id o placeholder).
# submit: MAI. L'Agent compila e si ferma. L'invio lo fai tu.

portals:
  f24-ipsoa:
    role: pc-f24
    name: F24 — IPSOA
    configured: false
    url: https://www.ipsoa.it
    field: "input[type=search], input[name*=cerca], input[placeholder*=erca]"
    username_field: "#loginInput"
    password_field: "#passwordInput"
    login_note: Completa l’accesso e l’eventuale OTP a mano. L’Agent non trasmette e non paga.
  contabilita-ipsoa:
    role: pc-contabilita
    name: Contabilità — IPSOA
    configured: false
    url: https://www.ipsoa.it
    field: "input[type=search], input[name*=cerca], input[placeholder*=erca]"
    username_field: "input[type=email], input[name*=user], input[name*=login]"
    password_field: "input[type=password]"
    login_note: L’Agent prepara l’importazione e si ferma prima di ogni conferma definitiva.
  contabilita-ade:
    role: pc-contabilita
    name: Contabilità — Agenzia delle Entrate
    url: https://www.agenziaentrate.gov.it
    field: "input[type=search], input[name*=cerca], input[placeholder*=erca]"
    login_note: SPID, CNS, CIE, smart card e OTP vengono completati soltanto dalla persona.
  visure-cgn:
    role: pc-visure
    name: Visure — CGN
    url: https://www.cgn.it
    field: "input[type=search], input[name*=cerca], input[placeholder*=erca]"
    username_field: "input[type=email], input[name*=user], input[name*=login]"
    password_field: "input[type=password]"
    login_note: Entra con le credenziali CGN dello studio, poi richiedi la visura.
  durc-inps:
    role: pc-durc
    name: DURC — INPS
    url: https://www.inps.it
    field: "input[type=search], input[name*=cerca], input[placeholder*=erca]"
    login_note: Entra con SPID o smart card del cliente. Lo fai tu a mano.
  contratti-ade:
    role: pc-contratti
    name: Contratti — Agenzia delle Entrate
    url: https://www.agenziaentrate.gov.it
    field: "input[type=search], input[name*=cerca], input[placeholder*=erca]"
    username_field: "input[type=email], input[name*=user], input[name*=login]"
    password_field: "input[type=password]"
    login_note: Entra con l'utenza di Samuele. Lo fai tu a mano.
  camerali-cgn:
    role: pc-camerali
    name: Pratiche camerali — CGN
    url: https://www.cgn.it
    field: "input[type=search], input[name*=cerca], input[placeholder*=erca]"
    username_field: "input[type=email], input[name*=user], input[name*=login]"
    password_field: "input[type=password]"
    login_note: Dopo CGN la pratica si completa su Desktop ComUnica.
  fatture-webdesk:
    role: pc-fatture
    name: Fatture — Webdesk
    configured: true
    url: https://app.webdesk.it/Apps/Login/View
    field: "input[type=search], input[name*=cerca], input[placeholder*=erca]"
    username_field: "#loginInput"
    password_field: "#passwordInput"
    # I nomi descrivono le schermate IPSOA viste nel manuale. I valori restano
    # vuoti finche l'Agent non impara i selettori dalla pagina vera: non vengono
    # mai indovinati da una fotografia.
    customer_search_fields:
      filter_type: ""
      query: ""
      membership_status: ""
      result_rows: ""
      access_button: ""
    customer_create_fields:
      customer_type: ""
      tax_code: ""
      vat_number: ""
      business_name: ""
      first_name: ""
      last_name: ""
      legal_address: ""
      recipient_code: ""
      pec: ""
      save_button: ""  # solo arresto/controllo: mai clic automatico
    invoice_fields: {}
    invoice_workflow:
      app_name: Fattura SMART
      new_invoice_path: [Home, Fatture, Crea nuovo]
      new_invoice_frame_path: CrudScDocument/CrudScDocument.html
      new_invoice_frame_id_is_dynamic: true
      customer_search_mode: sequential_keystrokes
      customer_search_wait_ms: 1000
      customer_match: exact_suggestion
      line_table:
        description_placeholder: Inserisci descrizione prodotto
        columns:
          description: 2
          quantity: 4
          unit: 5
          amount: 6
          discount: 7
          vat: 8
          intent_declaration: 9
          item_type: 10
          total: 11
        add_row_text: Aggiungi nuova riga
        default_vat_text: 22%
      customer_master_path: [Home, Clienti, Apri cliente, Dichiarazione d'intento]
      intent_missing_text: Nessuna dichiarazione presente
      intent_fields: [Data ricevuta telematica, Protocollo di ricezione della DI]
      intent_vat_text: Art. 8 c.1 lett.c DPR 633/72 - N3.5
      intent_is_per_line: true
      stop_before: [Salva, Salva comunque, Emetti, Invia]
    login_note: L'accesso a Webdesk lo completa la persona oppure usa Fort Knox con autorizzazione. Nessuna credenziale e' nel codice.

settings:
  # Quanto aspetta che tu finisca il login, prima di rinunciare.
  wait_for_login_seconds: 60
  # Ogni quanto ricontrolla se il campo è comparso.
  poll_seconds: 3
  # Safari è già incluso nel Mac e viene configurato dalla guida dell'Agent.
  mac_browser: Safari
