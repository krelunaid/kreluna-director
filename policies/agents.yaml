# Compiti Delta: un Agent, un lavoro, i programmi dello studio.
# Nessun invio reale (Telematico, SPID, smart card, INPS, AdE) in questa versione.

agents:
  - role: pc-fatture
    display_name: PC-FATTURE
    job: Fatture
    program: Webdesk e sito Agenzia delle Entrate (utenza cliente, smart card / SPID)
    platforms: [macos, windows]
    capabilities:
      - notepad_write
      - invoice_prepare_demo
      - invoice_submit_demo
      - portal_open
      - portal_learn
  - role: pc-f24
    display_name: PC-F24
    job: Deleghe F24
    program: Creazione IPSOA, poi Invio Telematico (in demo non si invia)
    platforms: [macos, windows]
    capabilities:
      - f24_prepare
      - portal_open
      - portal_learn
  - role: pc-contabilita
    display_name: PC-CONTABILITA
    job: Contabilità
    program: Scarico fatture AdE (SPID/smart card) XML/P7M, carico IPSOA, importatore contabile IPSOA
    platforms: [macos, windows]
    capabilities:
      - contabilita_prepare
      - invoice_check
      - portal_open
      - portal_learn
  - role: pc-camerali
    display_name: PC-CAMERALI
    job: Pratiche camerali
    program: Sito CGN, poi invio su Desktop ComUnica
    platforms: [macos, windows]
    capabilities:
      - camera_prepare
      - portal_open
      - portal_learn
  - role: pc-contratti
    display_name: PC-CONTRATTI
    job: Contratti
    program: Sito Agenzia delle Entrate di Samuele
    platforms: [macos, windows]
    capabilities:
      - contratti_prepare
      - portal_open
      - portal_learn
  - role: pc-durc
    display_name: PC-DURC
    job: Richieste DURC
    program: Sito INPS (utenza cliente, smart card / SPID)
    platforms: [macos, windows]
    capabilities:
      - durc_prepare
      - portal_open
      - portal_learn
  - role: pc-visure
    display_name: PC-VISURE
    job: Visure
    program: Sito CGN
    platforms: [macos, windows]
    capabilities:
      - visure_prepare
      - document_check
      - portal_open
      - portal_learn

  # Vecchi posti: restano in database se già creati, non si scelgono più.
  - role: pc-pagamenti
    display_name: PC-PAGAMENTI
    job: Vecchio ruolo
    program: Da riassegnare, apri Kreluna Agent e usa Cambia lavoro
    retired: true
    capabilities:
      - payment_prepare
  - role: pc-documenti
    display_name: PC-DOCUMENTI
    job: Vecchio ruolo
    program: Da riassegnare, apri Kreluna Agent e usa Cambia lavoro
    retired: true
