name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/director-web/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install web dependencies
        working-directory: apps/director-web
        run: npm ci
      - name: Lint
        run: python -m ruff check packages apps tests
      - name: Test
        run: python -m pytest -q
      - name: Build web app
        working-directory: apps/director-web
        run: npm run build
