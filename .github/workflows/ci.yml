name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/director-web/package-lock.json
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install web dependencies
        working-directory: apps/director-web
        run: npm ci
      - name: Install managed AI gateway dependencies
        working-directory: apps/kreluna-ai-gateway
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: python -m ruff check packages apps tests
      - name: Test
        run: python -m pytest -q
      - name: Build web app
        working-directory: apps/director-web
        run: npm run build
      - name: Check managed AI gateway
        working-directory: apps/kreluna-ai-gateway
        run: pnpm run check
