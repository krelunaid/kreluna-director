name: Release installabile

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  mac:
    name: Crea app Mac
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/director-web/package-lock.json
      - name: Prepara strumenti
        run: python -m pip install pillow
      - name: Verifica versione
        run: test "v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" = "${GITHUB_REF_NAME}"
      - name: Crea pacchetto Mac
        run: |
          bash scripts/macos/build-mac-app.sh
          bash scripts/macos/build-mac-agent.sh
      - uses: actions/upload-artifact@v5
        with:
          name: mac
          path: |
            dist-macos/Kreluna-Director-Mac.zip
            dist-macos/Kreluna-Director-Mac.zip.sha256
            dist-macos-agent/Kreluna-Agent-Mac.zip
            dist-macos-agent/Kreluna-Agent-Mac.zip.sha256

  windows:
    name: Crea app Windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/director-web/package-lock.json
      - name: Prepara strumenti
        run: python -m pip install pillow
      - name: Verifica versione
        run: test "v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" = "${GITHUB_REF_NAME}"
      - name: Crea pacchetto Windows
        run: |
          bash scripts/windows/build-windows-zip.sh
          bash scripts/windows/build-agent-zip.sh
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: |
            dist-windows/Kreluna-Director-Windows.zip
            dist-windows/Kreluna-Director-Windows.zip.sha256
            dist-agents/Kreluna-Agenti-Windows.zip
            dist-agents/Kreluna-Agenti-Windows.zip.sha256

  publish:
    name: Pubblica aggiornamento
    needs: [mac, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true
      - name: Pubblica release ufficiale
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/Kreluna-Director-Mac.zip \
            release/Kreluna-Director-Mac.zip.sha256 \
            release/Kreluna-Director-Windows.zip \
            release/Kreluna-Director-Windows.zip.sha256 \
            release/Kreluna-Agent-Mac.zip \
            release/Kreluna-Agent-Mac.zip.sha256 \
            release/Kreluna-Agenti-Windows.zip \
            release/Kreluna-Agenti-Windows.zip.sha256 \
            --repo "${GITHUB_REPOSITORY}" \
            --generate-notes \
            --title "Kreluna Director ${GITHUB_REF_NAME#v}"
