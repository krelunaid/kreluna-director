[project]
name = "kreluna-director"
version = "0.5.57"
description = "Kreluna Director — cloud IA that coordinates studio Windows/Linux agents with human approval."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "pyyaml>=6.0.2",
  "httpx>=0.28.0",
  "cryptography>=44.0.0",
  "pillow>=11.0.0",
  "websockets>=14.0",
  "python-multipart>=0.0.18",
  "argon2-cffi>=23.1.0",
]

[project.optional-dependencies]
browser = ["playwright==1.58.0"]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]
windows = [
  "pywinauto>=0.6.8",
  "pywebview>=6.2.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages/kreluna-shared/src", "apps/director-api", "apps/kreluna-agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [
  "packages/kreluna-shared/src",
  "apps/director-api",
  "apps/kreluna-agent",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Confini dove un errore non deve mai fermare il programma: l'Agent che riceve
# un compito, il Director che parla a una socket morta, il lanciatore sul
# desktop. Qui si cattura tutto di proposito e si riporta, non si esplode.
"apps/kreluna-agent/agent/main.py" = ["BLE001"]
"apps/kreluna-agent/agent/capabilities/notepad.py" = ["BLE001"]
"apps/kreluna-agent/agent/tools/automation.py" = ["BLE001"]
"apps/director-api/app/services/registry.py" = ["BLE001", "S112"]
"apps/director-desktop/kreluna_desktop.py" = ["BLE001", "S110", "DTZ005"]
"packages/kreluna-shared/src/kreluna_shared/crypto.py" = ["BLE001"]
"packages/kreluna-shared/src/kreluna_shared/update.py" = ["BLE001"]
"packages/kreluna-shared/src/kreluna_shared/planner.py" = ["BLE001"]
# La policy rifiuta un file di configurazione sbagliato con ValueError, che è
# quello che il resto del programma e i test si aspettano.
"packages/kreluna-shared/src/kreluna_shared/policy.py" = ["TRY004"]
