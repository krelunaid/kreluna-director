[project]
name = "kreluna-director"
version = "0.5.5"
description = "Kreluna Director — cloud IA that coordinates studio Windows/Linux agents with human approval."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "aiosqlite>=0.20.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "pyyaml>=6.0.2",
  "httpx>=0.28.0",
  "cryptography>=44.0.0",
  "pillow>=11.0.0",
  "websockets>=14.0",
  "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]
windows = [
  "pywinauto>=0.6.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages/kreluna-shared/src", "apps/director-api", "apps/kreluna-agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [
  "packages/kreluna-shared/src",
  "apps/director-api",
  "apps/kreluna-agent",
]

[tool.ruff]
line-length = 100
target-version = "py312"
