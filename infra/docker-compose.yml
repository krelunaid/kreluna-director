services:
  director:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ..:/app
    command: >
      bash -lc "pip install -e . &&
      PYTHONPATH=packages/kreluna-shared/src:apps/director-api
      python -m uvicorn app.main:app --host 0.0.0.0 --port 8080"
    ports:
      - "8080:8080"
    environment:
      DIRECTOR_DATABASE_URL: sqlite+aiosqlite:///./data/kreluna.db
